<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VibeSSH Metrics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2434"/>
      <stop offset="1" stop-color="#091019"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37c4e2"/>
      <stop offset="0.5" stop-color="#64e9ff"/>
      <stop offset="1" stop-color="#37c4e2"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64e9ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#64e9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2aa7c4"/>
      <stop offset="1" stop-color="#64e9ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#2aa7c4" stroke-opacity="0.45" stroke-width="4"/>

  <!-- faint monitor gridlines -->
  <g stroke="#7fd6ea" stroke-opacity="0.08" stroke-width="2">
    <line x1="72" y1="184" x2="440" y2="184"/>
    <line x1="72" y1="256" x2="440" y2="256"/>
    <line x1="72" y1="328" x2="440" y2="328"/>
  </g>

  <!-- ascending bars, the "monitor" motif -->
  <g fill="url(#bar)">
    <rect x="300" y="300" width="34" height="72" rx="8"/>
    <rect x="346" y="256" width="34" height="116" rx="8"/>
    <rect x="392" y="212" width="34" height="160" rx="8"/>
  </g>

  <!-- area under the pulse -->
  <path d="M72 300 H176 L200 300 L224 150 L252 384 L280 256 L300 300 H300 V372 H72 Z" fill="url(#fill)"/>

  <!-- the pulse / EKG line -->
  <path d="M72 300 H176 L200 300 L224 150 L252 384 L280 256 L300 300"
        fill="none" stroke="url(#line)" stroke-width="16"
        stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
</svg>
